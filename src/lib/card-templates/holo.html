<!-- 템플릿: 홀로그램 트레이딩 카드. 마우스를 따라 무지개 빛이 움직여요 -->
<style>
  .holo { --mx: 50%; --my: 50%; position: relative; height: 100%; padding: 14px; border-radius: 18px; overflow: hidden;
    background: linear-gradient(135deg, #2a1622, #120d18); color: #fff; font-family: Pretendard, system-ui, sans-serif; }
  .frame { position: relative; height: 100%; border-radius: 12px; border: 2px solid #ff8ab3aa; display: flex; flex-direction: column; overflow: hidden; background: #160f1a; }
  .art { flex: 1; position: relative; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #ff8ab355, transparent 60%), #1b1020; }
  .art b { font-size: 84px; font-weight: 900; color: #ffd6e5; text-shadow: 0 0 30px #ff8ab3; }
  .rar { position: absolute; top: 10px; left: 12px; font: 700 10px ui-monospace, monospace; letter-spacing: .18em; color: #ffd6e5; }
  .hp { position: absolute; bottom: 8px; right: 12px; font: 800 20px system-ui; color: #ffd6e5; }
  .info { padding: 12px 14px; border-top: 2px solid #ff8ab3aa; font-size: 13px; }
  .nm { margin: 0; font-size: 20px; font-weight: 800; }
  .nm small { font-weight: 400; opacity: .7; font-size: 13px; }
  .skill { display: flex; justify-content: space-between; margin: 6px 0 0; font: 12px ui-monospace, monospace; color: #ffd6e5; }
  .foil { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: color-dodge; opacity: .55;
    background: radial-gradient(circle at var(--mx) var(--my), #fff8, transparent 40%),
      conic-gradient(from 0deg at var(--mx) var(--my), #ff8ab3, #ffd23f, #8affc1, #7cc4ff, #c79bff, #ff8ab3); }
</style>
<div class="holo" id="h">
  <div class="frame">
    <div class="art"><span class="rar">★★★ RARE · {{cohorts}}기</span><span class="hp">HP 120</span><b>{{name}}</b></div>
    <div class="info">
      <p class="nm">{{name}} <small>· {{role}}</small></p>
      <p class="skill"><span>⚡ 내 필살기</span><span>80</span></p>
      <p class="skill"><span>✦ 두 번째 기술</span><span>120</span></p>
    </div>
  </div>
  <div class="foil"></div>
</div>
<script>
  const h = document.getElementById('h');
  addEventListener('pointermove', (e) => {
    h.style.setProperty('--mx', (e.clientX / innerWidth) * 100 + '%');
    h.style.setProperty('--my', (e.clientY / innerHeight) * 100 + '%');
  });
</script>
